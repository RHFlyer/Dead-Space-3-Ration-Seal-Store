; Ration Seal Store's manifest: what the DS3 Mod Loader and its Mods panel need to know about the add-on.
; Format: sdk\README.md. Comments go on their own lines (a ; after a value is part of the value).

[mod]
name=Ration Seal Store
; The [modules] key in ds3_mods.ini. Kept from the built-in store, so its switch name never changed.
id=seal_store
author=RHFlyer
version=1.0.0
; The oldest DS3 Mod Loader this add-on works with (it needs API 3). An older loader says so instead of loading it.
min_loader=1.0.0
description=Spend Ration Seals at the bench store on resource packs, upgrade circuits and weapon-part unlocks. Seals only, never money.
file=SealStore.asi
; Created by the Mods panel on the first change. Test-only [debug] keys (prices, pity, dumps) go there by hand.
ini=seal_store.ini

; Each [setting.*] section is one row in the Mods panel. The store reads them at every store visit, so a change applies
; the next time you open the store.

[setting.parts]
section=packs
key=resource_pack_parts
kind=bool
default=1
label=Resource Pack adds a weapon part
help=The Resource Pack also gives one standard weapon part from its own part tables, which the game shipped but never used.

[setting.circuits]
section=packs
key=circuit_packs
kind=bool
default=1
label=Circuit packs
help=Sell the Upgrade Circuit Pack, Elite Upgrade Circuit and Masterwork Circuit Pack.

[setting.schematics]
section=packs
key=schematics
kind=bool
default=1
label=Circuit Schematics
help=Sell Schematics that unlock circuits your save has not found. Needs circuit packs.

[setting.part_unlocks]
section=packs
key=part_unlocks
kind=bool
default=1
label=Weapon part Schematics
help=Sell Schematics for MK-V and MK-II weapon parts you do not have. Needs circuit packs.
